<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5d78a1">
<title>Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#dde1ec;--nav1:#b4c0d4;--nav2:#7d93b4;--nav3:#667fa4;--ff:Tahoma,Verdana,"Open Sans",Geneva,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:radial-gradient(circle at 50% 0,#4a6a96,#1d2b44);font:13px/1.35 var(--ff);display:flex;justify-content:center;align-items:center;color:#1b1b1b}
#app{width:100%;max-width:480px;height:100%;height:100dvh;background:var(--bg);position:relative;overflow:hidden}
@media(min-width:620px){#app{height:min(860px,96vh);border-radius:14px;box-shadow:0 0 0 6px #0d1422,0 20px 60px rgba(0,0,0,.6)}}
.screen{display:none;flex-direction:column;position:absolute;inset:0;min-width:0}
.screen.on{display:flex}
button,input,textarea{font-family:var(--ff)}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #1f6fe0;outline-offset:2px}
svg.ic{width:20px;height:20px;display:block}

/* barra superior */
.nav{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;background:linear-gradient(var(--nav1),var(--nav2) 50%,var(--nav3) 51%,#6f87ab);border-bottom:1px solid #26303f;box-shadow:inset 0 1px #dbe3ef;min-height:50px;flex-shrink:0}
.nav h1{margin:0;font-size:15px;color:#fff;text-shadow:0 -1px rgba(0,0,0,.45);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.nbtn{min-width:68px;height:28px;padding:0 12px;color:#fff;font-weight:700;font-size:12px;text-shadow:0 -1px rgba(0,0,0,.5);border:1px solid #28395a;border-radius:4px;background:linear-gradient(#9fb0cc,#5a739d 50%,#4a6590 51%,#5f7ba7);box-shadow:inset 0 1px rgba(255,255,255,.4),0 1px rgba(255,255,255,.3);flex-shrink:0}
.nbtn:active{filter:brightness(.8)}
.nbtn.dark{background:linear-gradient(#f4f4f6,#d3d6dd 50%,#c3c7d0 51%,#d6d9e0);color:#222;text-shadow:0 1px #fff;border-color:#6d7482}
.nbtn.danger{background:linear-gradient(#f08a80,#d2392b 50%,#bb2415 51%,#d6402f);border-color:#7d1409}
.sp{min-width:68px;flex-shrink:0}

/* avatar estilo foto de exibição */
.av{width:42px;height:42px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px #8aa0b8,0 2px 4px rgba(0,0,0,.3);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.4);flex-shrink:0;position:relative;overflow:hidden}
.av::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.05))}
.av.sm{width:26px;height:26px;font-size:12px;border-width:1px}

/* lista */
.search{display:flex;gap:10px;align-items:center;padding:7px 10px;background:linear-gradient(#c5cfdf,#a7b5cc);border-bottom:1px solid #6f7d94;flex-shrink:0}
.search input{flex:1;min-width:0;height:26px;border:1px solid #66748c;border-radius:13px;padding:0 12px;font-size:13px;box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
.search .link{color:#143b73;font-weight:700}
#list{flex:1;overflow:auto;background:#fff}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #dcdcdc;background:#fff;padding:9px 12px;font-size:13px}
.row:active{background:linear-gradient(#5b9cf0,#2f74dc);color:#fff}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:14px}
.row .l{display:block;color:#7b7b84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .tm{font-size:11px;color:#3b6fb5;align-self:flex-start;margin-top:3px;flex-shrink:0}
.row:active .l,.row:active .tm{color:#e3eeff}
.minus{display:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(#f4887c,#c9301f);border:1px solid #7d1409;position:relative;flex-shrink:0}
.minus::after{content:"";position:absolute;left:5px;right:5px;top:9px;height:3px;background:#fff;border-radius:1px}
#list.editing .minus{display:block}
.empty{padding:50px 28px;text-align:center;color:#6c778c;line-height:1.5}
.empty svg{width:64px;height:64px;margin:0 auto 10px;display:block}

/* conversa */
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0 12px;display:flex;flex-direction:column;background:var(--bg);min-width:0}
#msgs>*{flex-shrink:0}
.date{align-self:center;color:#7a8296;font-weight:700;font-size:11px;margin:10px 0 5px;text-shadow:0 1px #fff;white-space:nowrap}
.r{display:flex;padding:0 12px;margin-top:2px;min-width:0}
.r.out{justify-content:flex-end}
.r.end{margin-bottom:5px}
.b{max-width:80%;min-width:0;padding:6px 11px 7px;font-size:14px;line-height:1.35;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 0 0 1px rgba(0,0,0,.2)}
.in .b{background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.12) 50%,rgba(255,255,255,0) 51%),linear-gradient(#f2f2f6,#d0d0d7)}
.out .b{background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.08) 50%,rgba(255,255,255,0) 51%),linear-gradient(#a8e65c,#78cd27);color:#0c2300}
.b.sel{outline:3px solid #2f74dc;outline-offset:1px}
.b.m{padding:4px;width:244px}
.med{display:block;width:100%;height:auto;max-height:340px;border-radius:9px;background:#000;object-fit:contain}
.em{width:19px;height:19px;vertical-align:-4px;margin:0 1px}
.status{align-self:flex-end;padding:0 14px;font-size:10px;color:#7a8296;font-weight:700}
#selbar,#tray{display:none;background:#eef0f5;border-top:1px solid #b5bccb;flex-shrink:0}
#selbar.on{display:flex;gap:8px;align-items:center;padding:7px 10px}
#selbar span{flex:1;font-size:12px;color:#445}
#tray.on{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px}
#tray button{border:1px solid transparent;background:none;padding:3px;border-radius:5px}
#tray button:active,#tray button:hover{background:#cbd5e8;border-color:#8ea4c8}
#tray .em{width:26px;height:26px;margin:0;vertical-align:top}
.bar{display:flex;gap:7px;align-items:flex-end;padding:7px 8px calc(env(safe-area-inset-bottom,0px) + 7px);background:linear-gradient(#eef0f5,#c3cad7);border-top:1px solid #7d8594;flex-shrink:0}
.ib{width:32px;height:32px;border-radius:4px;border:1px solid #5d6778;background:linear-gradient(#fbfbfd,#c4c9d3);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#3f4b63;padding:0;box-shadow:0 1px rgba(255,255,255,.7)}
.ib .em{margin:0;vertical-align:0}
.ib:active{filter:brightness(.85)}
.bar textarea{flex:1;min-width:0;resize:none;max-height:96px;height:32px;border:1px solid #6d7482;border-radius:4px;padding:6px 9px;font-size:14px;line-height:1.2;box-shadow:inset 0 2px 3px rgba(0,0,0,.2);background:#fff}
.send{height:32px;padding:0 13px;border-radius:4px;border:1px solid #1b3f8f;color:#fff;font-weight:700;font-size:12px;text-shadow:0 -1px rgba(0,0,0,.5);background:linear-gradient(#7ba3ee,#2d5fce 50%,#1747b8 51%,#3a70dd);box-shadow:inset 0 1px rgba(255,255,255,.4)}
.send:disabled{filter:grayscale(.8) opacity(.65)}

/* login */
#login{background:radial-gradient(ellipse at 50% -10%,#e4f3ff,#9cc9ec 50%,#4f88bc);align-items:center;justify-content:center;padding:16px;overflow:auto}
.win{width:100%;max-width:330px;background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(190,220,243,.8) 40%,rgba(160,203,234,.85));border:1px solid #29476a;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 12px 34px rgba(0,0,0,.5)}
.win .t{padding:6px 12px;font-size:12px;color:#102a43;text-shadow:0 0 8px #fff}
.win .in{margin:0 7px 7px;background:#fff;border:1px solid #86a3be;padding:14px 20px 12px;text-align:center}
.avatar{width:104px;height:104px;margin:0 auto 4px;border:3px solid #fff;border-radius:8px;background:radial-gradient(#f0f8fe,#8fbde0);box-shadow:0 0 0 1px #6b90b0,0 4px 10px rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.avatar svg{width:80px;height:80px}
.win h2{color:#1d4f82;font-weight:400;font-size:20px;margin:8px 0 3px}
.win p{margin:0 0 9px;color:#333}
.fields{border:1px solid #d3dce5;padding:9px;text-align:left;background:#f9fbfd}
.fields input[type=text],.fields input[type=email],.fields input[type=password]{width:100%;height:28px;margin-bottom:7px;padding:0 6px;border:1px solid #7f9db9;font-size:13px}
.chk{display:flex;align-items:center;gap:6px;color:#222}
.go{display:block;margin:12px auto 3px;height:26px;min-width:90px;padding:0 16px;font-size:12px;color:#111;border:1px solid #707070;border-radius:3px;background:linear-gradient(#f4f4f4,#ececec 50%,#dedede 51%,#d0d0d0)}
.go:hover,.go:focus-visible{border-color:#3c7fb1;box-shadow:inset 0 0 0 1px #8dd1f8}
.go:disabled{opacity:.6}
.link{background:none;border:0;color:#0066cc;font-size:12px;padding:2px;text-decoration:underline}
.err{color:#b00020;min-height:16px;margin:7px 0 0!important}
.foot{display:flex;justify-content:space-between;margin-top:8px}

/* janelas */
#modal{position:absolute;inset:0;background:rgba(10,20,40,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal.on{display:flex}
.card{width:100%;max-width:310px;background:linear-gradient(#f6f8fc,#d5dbe7);border:1px solid #3a4a66;border-radius:8px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card h3{margin:0 0 4px;font-size:15px;color:#1d3f6b}
.card p{margin:0 0 9px;color:#505a6e}
.card input{width:100%;height:30px;border:1px solid #6d7482;border-radius:3px;padding:0 8px;font-size:14px;box-shadow:inset 0 2px 3px rgba(0,0,0,.15)}
.card .btns{display:flex;gap:8px;margin-top:11px}
.card .btns button{flex:1}
#lb{position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:7;display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%}
#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(20,28,45,.92);color:#fff;padding:7px 14px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center;z-index:8}
#toast.on{opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="fg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#fff8b0"/><stop offset=".55" stop-color="#ffd12e"/><stop offset="1" stop-color="#ee9c00"/></radialGradient>
<radialGradient id="fa" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#ffc59a"/><stop offset=".55" stop-color="#ff6a3a"/><stop offset="1" stop-color="#d12a10"/></radialGradient>
</defs></svg>

<div id="app">
  <section id="login" class="screen on">
    <div class="win">
      <div class="t">Messenger</div>
      <div class="in">
        <div class="avatar"><svg viewBox="0 0 80 80"><circle cx="40" cy="26" r="14" fill="#fff" stroke="#9db6cb"/><path d="M10 80c0-22 14-30 30-30s30 8 30 30z" fill="#fff" stroke="#9db6cb"/></svg></div>
        <h2 id="ttl">Entrar</h2>
        <p id="sub">Entre com seu e-mail e senha.</p>
        <form id="f" class="fields">
          <input id="name" type="text" placeholder="Seu nome" autocomplete="nickname" maxlength="40" hidden>
          <input id="email" type="email" placeholder="E-mail" autocomplete="email" required>
          <input id="pass" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" minlength="6" required>
          <label class="chk"><input type="checkbox" id="remember" checked> Lembrar de mim</label>
          <button class="go" id="gobtn">Entrar</button>
        </form>
        <p class="err" id="err" role="alert"></p>
        <div class="foot"><button class="link" id="toggle" type="button">Criar uma conta</button><button class="link" id="forgot" type="button">Esqueci a senha</button></div>
      </div>
    </div>
  </section>

  <section id="home" class="screen">
    <div class="nav"><button class="nbtn" id="acc">Minha conta</button><h1>Mensagens</h1><button class="nbtn" id="new">Nova</button></div>
    <div class="search"><input id="q" type="search" placeholder="Buscar conversas" aria-label="Buscar conversas"><button class="link" id="edit" type="button">Editar</button></div>
    <div id="list"></div>
  </section>

  <section id="chat" class="screen">
    <div class="nav"><button class="nbtn" id="back">Voltar</button><h1><span class="av sm" id="cav"></span><span id="who"></span></h1><span class="sp"></span></div>
    <div id="msgs"></div>
    <div id="selbar"><span>Mensagem selecionada</span><button class="nbtn dark" id="sopen" type="button">Abrir</button><button class="nbtn danger" id="sdel" type="button">Excluir</button><button class="nbtn dark" id="scan" type="button">Cancelar</button></div>
    <div id="tray"></div>
    <form class="bar" id="sendf">
      <button type="button" class="ib" id="att" aria-label="Enviar foto ou vídeo"><svg class="ic" viewBox="0 0 24 24"><path d="M16.5 6.5l-8 8a2.2 2.2 0 003.1 3.1l8.4-8.4a4.2 4.2 0 00-6-6L5.7 11.8a6.2 6.2 0 008.8 8.8l6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button type="button" class="ib" id="emo" aria-label="Emoticons"></button>
      <textarea id="txt" rows="1" maxlength="1000" placeholder="Digite sua mensagem" aria-label="Mensagem"></textarea>
      <button class="send" id="sendbtn" disabled>Enviar</button>
      <input type="file" id="file" accept="image/*,video/*" hidden>
    </form>
  </section>

  <div id="modal">
    <form class="card" id="nf" hidden><h3>Nova conversa</h3><p>Digite o e-mail de quem já criou conta.</p>
      <input id="nemail" type="email" placeholder="amigo@email.com" required autocomplete="off"><p class="err" id="nerr" role="alert"></p>
      <div class="btns"><button type="button" class="nbtn dark" data-close>Cancelar</button><button class="nbtn" id="nok">Conversar</button></div></form>
    <form class="card" id="cf" hidden><h3 id="ct"></h3><p id="cp"></p>
      <div class="btns"><button type="button" class="nbtn dark" data-close>Cancelar</button><button class="nbtn danger">Excluir</button></div></form>
    <form class="card" id="af" hidden><h3>Minha conta</h3><p id="amail"></p>
      <input id="aname" type="text" maxlength="40" placeholder="Nome de usuário" required><p class="err" id="aerr" role="alert"></p>
      <div class="btns"><button type="button" class="nbtn dark" data-close>Fechar</button><button class="nbtn">Salvar nome</button></div>
      <div class="btns"><button type="button" class="nbtn danger" id="aout">Sair da conta</button></div></form>
  </div>
  <div id="lb"><img alt="Foto ampliada"></div>
  <div id="toast" role="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBE4pFvb_1_QxZnKIE5DItzrAald2X3RDs",
  authDomain: "messenger-7d396.firebaseapp.com",
  projectId: "messenger-7d396",
  storageBucket: "messenger-7d396.firebasestorage.app",

const auth = firebase.auth(), db = firebase.firestore(), storage = firebase.storage(), TS = firebase.firestore.FieldValue.serverTimestamp;
storage.setMaxUploadRetryTime(20000); storage.setMaxOperationRetryTime(15000);
// false = fotos salvas direto no Firestore (sem Storage). true = usa o Firebase Storage (necessário para vídeos).
const USE_STORAGE = false;
const $ = id => document.getElementById(id);
let me = null, myName = "", unsubList = null, unsubMsgs = null, curChat = null, signup = false, busy = false, chats = [], firstLoad = true, editing = false, sel = null, msgMap = {}, pending = null;

const show = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2800); }
function avatar(name, cls = ""){
  const n = (name || "?").trim(); let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<span class="av ${cls}" style="background:linear-gradient(hsl(${h},60%,62%),hsl(${h},65%,42%))">${esc(n[0].toUpperCase())}</span>`;
}
const hhmm = d => d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const stamp = d => (sameDay(d, new Date()) ? "Hoje" : d.toLocaleDateString("pt-BR")) + " " + hhmm(d);

/* ---------- emoticons clássicos (desenhados em SVG) ---------- */
const eyes = '<ellipse cx="8.6" cy="9.6" rx="1.3" ry="1.9" fill="#3a2a00"/><ellipse cx="15.4" cy="9.6" rx="1.3" ry="1.9" fill="#3a2a00"/>';
const ln = d => `<path d="${d}" fill="none" stroke="#3a2a00" stroke-width="1.6" stroke-linecap="round"/>`;
const FACES = {

  wink:[[";)",";-)"], ln("M6.8 10.2q1.8-1.8 3.6 0") + '<ellipse cx="15.4" cy="9.6" rx="1.3" ry="1.9" fill="#3a2a00"/>' + ln("M6.8 14q5.2 5.4 10.4 0")],
  sad:[[":(",":-("], eyes + ln("M7 17.6q5-5 10 0")],

  tongue:[[":P",":-P",":p"], eyes + ln("M6.8 14q5.2 4.4 10.4 0") + '<path d="M12.4 16.2v3q0 1.9 1.8 1.9t1.8-1.9v-3.6z" fill="#ff6f91" stroke="#a02a4a" stroke-width=".8"/>'],
  wow:[[":O",":-O",":o"], eyes + '<ellipse cx="12" cy="16.4" rx="2.4" ry="3.1" fill="#6b1414" stroke="#3a2a00" stroke-width="1"/>'],
  angry:[[":@",":-@"], eyes + ln("M5.8 6.6l5 2.2M18.2 6.6l-5 2.2") + ln("M7.4 17.8q4.6-4 9.2 0")],
  cool:[["(H)","(h)"], '<path d="M3.6 8h7.8v4.2q0 2.2-2.2 2.2H5.8q-2.2 0-2.2-2.4zM12.6 8h7.8v4.2q0 2.2-2.2 2.2h-3.4q-2.2 0-2.2-2.4z" fill="#1a1a1a"/><path d="M11.4 9.2h1.2" stroke="#1a1a1a" stroke-width="1.4"/>' + ln("M7.2 16.8q4.8 3.8 9.6 0")],
  confused:[[":S",":s",":-S"], eyes + ln("M7 16.6q2.4-2.4 5 0t5 0")],
  blush:[[":$",":-$"], eyes + '<circle cx="5.4" cy="13.2" r="2" fill="#ff7a7a" opacity=".7"/><circle cx="18.6" cy="13.2" r="2" fill="#ff7a7a" opacity=".7"/>' + ln("M7.6 15q4.4 3.6 8.8 0")],
  heart:[["(L)","(l)"], ""]
};
function face(k){
  if (k === "heart") return '<svg class="em" viewBox="0 0 24 24" role="img" aria-label="coração"><path d="M12 21C5 15.4 2 11.8 2 8.3 2 5.2 4.3 3 7 3c2 0 3.8 1 5 2.8C13.2 4 15 3 17 3c2.700 0 5 2.200 5 5.300 0 3.500-3 7.100-10 12.700z" fill="#e0243a" stroke="#8c0f1f"/><ellipse cx="7.6" cy="7" rx="2.6" ry="1.5" fill="#fff" opacity=".5"/></svg>';
  return `<svg class="em" viewBox="0 0 24 24" role="img" aria-label="${k}"><circle cx="12" cy="12" r="10.6" fill="url(#${k === "angry" ? "fa" : "fg"})" stroke="#b07a00"/><ellipse cx="9.5" cy="5.4" rx="5.4" ry="2.6" fill="#fff" opacity=".42"/>${FACES[k][1]}</svg>`;
}
const CODE = {}; Object.entries(FACES).forEach(([k, v]) => v[0].forEach(c => CODE[esc(c)] = k));
const reCodes = new RegExp("(?<![^\\s])(" + Object.keys(CODE).sort((a, b) => b.length - a.length).map(c => c.replace(/[.*+?^${}()|[\]\\$]/g, "\\$&")).join("|") + ")(?![^\\s])", "g");
const fmt = t => esc(t).replace(reCodes, m => face(CODE[m]));
$("emo").innerHTML = face("smile");
$("tray").innerHTML = Object.keys(FACES).map(k => `<button type="button" data-c="${FACES[k][0][0]}" aria-label="${k}">${face(k)}</button>`).join("");

/* ---------- janelas ---------- */
function openModal(id){ document.querySelectorAll(".card").forEach(c => c.hidden = c.id !== id); $("modal").classList.add("on"); }
function closeModal(){ $("modal").classList.remove("on"); if (pending) { pending(false); pending = null; } }
$("modal").onclick = e => { if (e.target.id === "modal" || e.target.hasAttribute("data-close")) closeModal(); };
function ask(title, text){ $("ct").textContent = title; $("cp").textContent = text; openModal("cf"); return new Promise(r => pending = r); }
$("cf").onsubmit = e => { e.preventDefault(); const r = pending; pending = null; $("modal").classList.remove("on"); r && r(true); };

/* ---------- login ---------- */
function setMode(s){
  signup = s; $("name").hidden = !s; $("name").required = s;
  $("ttl").textContent = $("gobtn").textContent = s ? "Criar conta" : "Entrar";
  $("toggle").textContent = s ? "Já tenho conta" : "Criar uma conta";
  $("sub").textContent = s ? "Escolha um nome para seus amigos." : "Entre com seu e-mail e senha.";
  $("pass").autocomplete = s ? "new-password" : "current-password"; $("err").textContent = "";
}
$("toggle").onclick = () => setMode(!signup);
$("forgot").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) { $("err").textContent = "Digite seu e-mail e toque de novo."; return; }
  try { await auth.sendPasswordResetEmail(email); $("err").style.color = "#1a6b1a"; $("err").textContent = "Enviamos um link para redefinir a senha."; }
  catch { $("err").style.color = ""; $("err").textContent = "Não foi possível enviar. Confira o e-mail."; }
};
$("f").onsubmit = async e => {
  e.preventDefault(); $("err").style.color = ""; $("err").textContent = ""; $("gobtn").disabled = true;
  const email = $("email").value.trim(), pass = $("pass").value; busy = true;
  try {
    await auth.setPersistence($("remember").checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
    if (signup) {
      const name = $("name").value.trim();
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await db.doc("users/" + cred.user.uid).set({ name, email: email.toLowerCase() });
      myName = name; busy = false; await onUser(cred.user);
    } else { busy = false; await auth.signInWithEmailAndPassword(email, pass); }
  } catch (x) {
    busy = false;
    const m = { "auth/invalid-credential":"E-mail ou senha incorretos.", "auth/email-already-in-use":"Este e-mail já tem conta.", "auth/weak-password":"Use uma senha de 6 ou mais caracteres.", "auth/invalid-email":"E-mail inválido.", "auth/too-many-requests":"Muitas tentativas. Aguarde um pouco." };
    $("err").textContent = m[x.code] || "Não foi possível entrar: " + x.message;
  } finally { $("gobtn").disabled = false; }
};
auth.onAuthStateChanged(u => { if (busy) return; if (u) onUser(u); else { cleanup(); show("login"); } });
async function onUser(u){
  me = u;
  if (!myName) { try { const d = await db.doc("users/" + u.uid).get(); myName = d.exists ? d.data().name : u.email; } catch { myName = u.email; } }
  show("home"); watchList();
}
function cleanup(){ unsubList && unsubList(); unsubMsgs && unsubMsgs(); me = null; myName = ""; curChat = null; chats = []; $("pass").value = ""; editing = false; }

/* ---------- conta ---------- */
$("acc").onclick = () => { $("amail").textContent = me.email; $("aname").value = myName; $("aerr").textContent = ""; openModal("af"); };
$("aout").onclick = () => { closeModal(); auth.signOut(); };
$("af").onsubmit = async e => {
  e.preventDefault(); const n = $("aname").value.trim(); if (!n) return;
  try {
    await db.doc("users/" + me.uid).update({ name: n });
    const cs = await db.collection("chats").where("members", "array-contains", me.uid).get();
    await Promise.all(cs.docs.map(d => d.ref.update("names." + me.uid, n)));
    myName = n; closeModal(); toast("Nome alterado para " + n);
  } catch (x) { $("aerr").textContent = "Erro: " + x.message; }
};

/* ---------- lista ---------- */
function drawList(){
  const q = $("q").value.trim().toLowerCase();
  const rows = chats.filter(c => !q || (c.names?.[c.other] || "").toLowerCase().includes(q));
  $("list").classList.toggle("editing", editing); $("edit").textContent = editing ? "Concluído" : "Editar";
  $("list").innerHTML = rows.length ? rows.map(c => {
    const n = c.names?.[c.other] || "Contato", d = c.lastAt ? c.lastAt.toDate() : null;
    const tm = d ? (sameDay(d, new Date()) ? hhmm(d) : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })) : "";
    return `<button class="row" data-id="${c.id}" data-name="${esc(n)}"><span class="minus"></span>${avatar(n)}<span class="tx"><b>${esc(n)}</b><span class="l">${esc(c.lastText || "Nova conversa")}</span></span><span class="tm">${tm}</span></button>`;
  }).join("") : `<div class="empty"><svg viewBox="0 0 48 48"><rect x="4" y="6" width="40" height="28" rx="8" fill="#e4eefb" stroke="#6f93b3" stroke-width="2"/><path d="M13 34l-3 9 11-9z" fill="#e4eefb" stroke="#6f93b3" stroke-width="2" stroke-linejoin="round"/></svg>${q ? "Nenhuma conversa encontrada." : "Nenhuma conversa ainda.<br>Toque em <b>Nova</b> e digite o e-mail de um amigo que já criou conta."}</div>`;
}
function watchList(){
  unsubList && unsubList();
  unsubList = db.collection("chats").where("members", "array-contains", me.uid).onSnapshot(snap => {
    chats = snap.docs.map(d => { const c = d.data({ serverTimestamps: "estimate" }); return { id: d.id, ...c, other: c.members.find(m => m !== me.uid) }; })
      .sort((a, b) => (b.lastAt?.seconds || 0) - (a.lastAt?.seconds || 0));
    drawList();
  }, err => { $("list").innerHTML = `<div class="empty">Erro ao carregar: ${esc(err.message)}</div>`; });
}
$("q").oninput = drawList;
$("edit").onclick = () => { editing = !editing; drawList(); };
$("list").onclick = async e => {
  const r = e.target.closest(".row"); if (!r) return;
  if (!editing) return openChat(r.dataset.id, r.dataset.name);
  if (await ask("Excluir conversa?", "Todas as mensagens com " + r.dataset.name + " serão apagadas para os dois.")) {
    try { await delChat(r.dataset.id); toast("Conversa excluída"); } catch (x) { toast("Erro ao excluir: " + x.message); }
  }
};
async function delChat(id){
  const snap = await db.collection("chats/" + id + "/messages").get(), paths = [];
  for (let i = 0; i < snap.docs.length; i += 400) {
    const b = db.batch();
    snap.docs.slice(i, i + 400).forEach(d => { b.delete(d.ref); if (d.data().path) paths.push(d.data().path); });
    await b.commit();
  }
  await db.doc("chats/" + id).delete();
  paths.forEach(p => storage.ref(p).delete().catch(() => {}));
}
$("new").onclick = () => { $("nerr").textContent = ""; $("nemail").value = ""; openModal("nf"); $("nemail").focus(); };
$("nf").onsubmit = async e => {
  e.preventDefault(); $("nerr").textContent = ""; $("nok").disabled = true;
  try {
    const email = $("nemail").value.trim().toLowerCase();
    const q = await db.collection("users").where("email", "==", email).limit(1).get();
    if (q.empty) { $("nerr").textContent = "Nenhuma conta com esse e-mail."; return; }
    const other = q.docs[0];
    if (other.id === me.uid) { $("nerr").textContent = "Esse é o seu próprio e-mail."; return; }
    const id = [me.uid, other.id].sort().join("_"), ref = db.doc("chats/" + id);
    const ex = await ref.get().catch(() => null);
    if (!ex || !ex.exists) await ref.set({ members: [me.uid, other.id], names: { [me.uid]: myName, [other.id]: other.data().name }, lastText: "", lastAt: TS() });
    closeModal(); openChat(id, other.data().name);
  } catch (x) { $("nerr").textContent = "Erro: " + x.message; }
  finally { $("nok").disabled = false; }
};

/* ---------- conversa ---------- */
function clearSel(){ sel = null; $("selbar").classList.remove("on"); document.querySelectorAll(".b.sel").forEach(b => b.classList.remove("sel")); }
function openChat(id, name){
  curChat = id; firstLoad = true; clearSel();
  $("who").textContent = name; $("cav").outerHTML = avatar(name, "sm").replace("<span", '<span id="cav"');
  $("msgs").innerHTML = ""; $("tray").classList.remove("on"); show("chat");
  unsubMsgs && unsubMsgs();
  unsubMsgs = db.collection("chats/" + id + "/messages").orderBy("ts").onSnapshot(snap => {
    const box = $("msgs"), nearEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    const list = snap.docs.map(d => { const m = d.data({ serverTimestamps: "estimate" }); return { id: d.id, ...m, t: m.ts ? m.ts.toDate() : new Date() }; });
    msgMap = {}; let html = "", prevT = 0;
    list.forEach((m, i) => {
      msgMap[m.id] = m;
      if (m.t - prevT > 30 * 60 * 1000) html += `<div class="date">${stamp(m.t)}</div>`;
      prevT = m.t;
      const next = list[i + 1], last = !next || next.from !== m.from || next.t - m.t > 30 * 60 * 1000;
      let inner;
      if (m.kind === "image") inner = `<img class="med" loading="lazy" src="${esc(m.url)}" alt="Foto">`;
      else if (m.kind === "video") inner = `<video class="med" src="${esc(m.url)}" controls preload="metadata" playsinline></video>`;
      else inner = fmt(m.text);
      html += `<div class="r ${m.from === me.uid ? "out" : "in"}${last ? " end" : ""}"><div class="b${m.kind === "image" || m.kind === "video" ? " m" : ""}${sel && sel.id === m.id ? " sel" : ""}" data-id="${m.id}">${inner}</div></div>`;
    });
    const lm = list[list.length - 1];
    if (lm && lm.from === me.uid) html += `<div class="status">${snap.metadata.hasPendingWrites ? "Enviando…" : "Enviada"}</div>`;
    box.innerHTML = html || `<div class="date">Nenhuma mensagem. Diga oi!</div>`;
    if (sel && !msgMap[sel.id]) clearSel();
    if (nearEnd || firstLoad || snap.metadata.hasPendingWrites) box.scrollTop = box.scrollHeight;
    firstLoad = false;
  }, err => toast("Erro: " + err.message));
}
$("back").onclick = () => { unsubMsgs && unsubMsgs(); curChat = null; clearSel(); show("home"); };

/* selecionar, abrir e excluir mensagem */
$("msgs").onclick = e => {
  const b = e.target.closest(".b");
  if (!b || e.target.closest("video")) return clearSel();
  const m = msgMap[b.dataset.id]; if (!m) return;
  clearSel(); sel = m; b.classList.add("sel");
  $("sopen").hidden = m.kind !== "image"; $("sdel").hidden = m.from !== me.uid;
  $("selbar").classList.add("on");
};
$("scan").onclick = clearSel;
$("sopen").onclick = () => { $("lb").querySelector("img").src = sel.url; $("lb").classList.add("on"); };
$("lb").onclick = () => $("lb").classList.remove("on");
$("sdel").onclick = async () => {
  const m = sel; if (!m) return;
  if (!await ask("Excluir mensagem?", "Ela some da conversa para os dois.")) return;
  try {
    await db.doc("chats/" + curChat + "/messages/" + m.id).delete();
    if (m.path) storage.ref(m.path).delete().catch(() => {});
    clearSel();
    const chatId = curChat, q = await db.collection("chats/" + chatId + "/messages").orderBy("ts", "desc").limit(1).get();
    const l = q.empty ? null : q.docs[0].data({ serverTimestamps: "estimate" });
    await db.doc("chats/" + chatId).update({
      lastText: l ? (l.kind === "image" ? "Foto" : l.kind === "video" ? "Vídeo" : l.text).slice(0, 80) : "",
      lastAt: l && l.ts ? l.ts : TS()
    });
  } catch (x) { toast("Erro ao excluir: " + x.message); }
};

/* emoticons e texto */
$("emo").onclick = () => $("tray").classList.toggle("on");
$("tray").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = $("txt"); t.value += (t.value && !/\s$/.test(t.value) ? " " : "") + b.dataset.c + " "; t.dispatchEvent(new Event("input")); t.focus();
};
$("txt").oninput = () => {
  const t = $("txt"); t.style.height = "32px"; t.style.height = Math.min(t.scrollHeight, 96) + "px";
  $("sendbtn").disabled = !t.value.trim();
};
$("txt").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); $("sendf").requestSubmit(); } };
async function sendMsg(data, preview){
  const id = curChat;
  await db.collection("chats/" + id + "/messages").add({ from: me.uid, text: "", kind: "text", ts: TS(), ...data });
  await db.doc("chats/" + id).update({ lastText: preview.slice(0, 80), lastAt: TS() });
}
$("sendf").onsubmit = async e => {
  e.preventDefault();
  const text = $("txt").value.trim(); if (!text || !curChat) return;
  $("txt").value = ""; $("txt").style.height = "32px"; $("sendbtn").disabled = true; $("tray").classList.remove("on");
  try { await sendMsg({ text }, text); }
  catch (x) { toast("Não foi possível enviar: " + x.message); $("txt").value = text; $("txt").dispatchEvent(new Event("input")); }
};

/* ---------- fotos e vídeos ---------- */
$("att").onclick = () => $("file").click();
function toCanvas(file, max){
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c);
    };
    img.onerror = () => no(new Error("Não foi possível ler a imagem")); img.src = u;
  });
}
async function upload(blob, ext, type){
  const ref = storage.ref(`chats/${curChat}/${me.uid}/${Date.now()}.${ext}`), task = ref.put(blob, { contentType: type });
  task.on("state_changed", s => toast("Enviando " + Math.round(100 * s.bytesTransferred / s.totalBytes) + "%"));
  await task; return { url: await ref.getDownloadURL(), path: ref.fullPath };
}
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !curChat) return;
  try {
    if (f.type.startsWith("image/")) {
      let sent = false;
      if (USE_STORAGE) {
        try {
          const c = await toCanvas(f, 1280), blob = await new Promise(r => c.toBlob(r, "image/jpeg", .82));
          const u = await upload(blob, "jpg", "image/jpeg"); await sendMsg({ kind: "image", ...u }, "Foto"); sent = true;
        } catch {}
      }
      if (!sent) {
        let url = "";
        for (const [max, q] of [[1280, .78], [1024, .72], [800, .65], [640, .55]]) {
          url = (await toCanvas(f, max)).toDataURL("image/jpeg", q);
          if (url.length < 880000) break;
        }
        if (url.length >= 880000) throw new Error("Foto grande demais.");
        await sendMsg({ kind: "image", url }, "Foto");
      }
      toast("Foto enviada");
    } else if (f.type.startsWith("video/")) {
      if (!USE_STORAGE) return toast("Vídeos precisam do Storage. Mude USE_STORAGE para true.");
      if (f.size > 50e6) return toast("Vídeo maior que 50 MB.");
      try { const u = await upload(f, (f.name.split(".").pop() || "mp4").toLowerCase(), f.type); await sendMsg({ kind: "video", ...u }, "Vídeo"); toast("Vídeo enviado"); }
      catch (x) { toast("Vídeos precisam do Firebase Storage ativado."); }
    } else toast("Escolha uma foto ou um vídeo.");
  } catch (x) { toast("Erro: " + x.message); }
};
</script>
